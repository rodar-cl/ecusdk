[vehicle]
name = "scenario-car"
vin = "ECUSDK00000000002"
seed = 7

[buses.powertrain]
type = "can"
bitrate = 500000

[ecus.ecm]
bus = "powertrain"

[ecus.ecm.can]
request_id = 2016
response_id = 2024

[ecus.ecm.signals.rpm]
initial = 850
min = 0
max = 7000

[ecus.ecm.signals.rpm.generator]
type = "ramp"
start = 850
end = 3000
duration = 10
at = 5

[ecus.ecm.signals.speed]
initial = 0

[ecus.ecm.signals.coolant_temperature]
initial = 20
min = -40
max = 215

[ecus.ecm.signals.coolant_temperature.generator]
type = "ramp"
start = 20
end = 90
duration = 120

[ecus.ecm.signals.battery_voltage]
initial = 14.1

[ecus.ecm.signals.battery_voltage.generator]
type = "random"
minimum = 13.8
maximum = 14.4
seed = 1

[ecus.ecm.obd]
"01:05" = "coolant_temperature"
"01:0C" = "rpm"
"01:0D" = "speed"
"01:42" = "battery_voltage"

[ecus.ecm.uds.dids]
0xF18C = "ECM-SN-0001"

[ecus.ecm.uds.dids.0x0101]
signal = "rpm"
length = 2
scale = 4

[ecus.tcm]
bus = "powertrain"

[ecus.tcm.can]
request_id = 2017
response_id = 2025

[ecus.tcm.signals.speed]
initial = 0

[ecus.tcm.signals.speed.generator]
type = "sine"
offset = 60
amplitude = 20
period = 30

[ecus.tcm.obd]
"01:0D" = "speed"

[scenario]
events = [
    { at = 20, ecu = "ecm", action = "sensor_frozen", signal = "rpm", duration = 5 },
    { at = 30, ecu = "tcm", action = "ecu_offline", duration = 3 },
    { at = 40, ecu = "ecm", action = "latency", delay = 0.1, duration = 10 },
]
